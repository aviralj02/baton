<!--
  The square for a profile picture.

  Full bleed rather than the squircle: every platform masks an avatar to a
  circle, and at the 45 degree diagonals that circle passes outside the
  squircle's corners, so logo-plate.svg would show four slivers of whatever the
  page behind it happens to be. Filling the square removes the question.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#302B27"/>
      <stop offset="1" stop-color="#181513"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#ground)"/>

  <g transform="translate(176.6875 205.6875) scale(29)" stroke="#F2B33D" stroke-linecap="round">
    <path d="M9.75 14.25 18 6" stroke-width="3.5"/>
    <path d="M4.5 15.75 7.75 12.5" stroke-width="2.25" stroke-opacity="0.5"/>
  </g>
</svg>
