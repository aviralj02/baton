<!--
  The Open Graph card, rendered to site/public/og.png at 1200x630:

      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
        --headless --disable-gpu --force-device-scale-factor=2 \
        --window-size=1200,630 --screenshot=site/public/og.png assets/og.html

  Dark regardless of the viewer's theme: a share card is composited onto
  whatever chrome the feed has, and a light card on a light feed dissolves.
  Every colour here is a literal from the site's dark token set rather than a
  var, because this file is rasterised once and never inherits anything.
-->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0c0a09;
        font-family: ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 76px 80px 64px;
        display: flex;
        flex-direction: column;
        /* The headline sits on the optical centre, the meta row on the floor. */
        justify-content: space-between;
      }

      /* One soft light behind the mark, so the ground is not a flat rectangle.
         Kept under 10% or it reads as a gradient someone forgot to finish. */
      .glow {
        position: absolute;
        top: -260px;
        left: -180px;
        width: 900px;
        height: 900px;
        background: radial-gradient(circle, rgba(242, 179, 61, 0.09) 0%, transparent 65%);
      }

      .top { position: relative; display: flex; align-items: center; gap: 18px; }

      .name {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 21px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #a8a29e;
      }

      h1 {
        position: relative;
        max-width: 1040px;
        font-family: ui-serif, "New York", "Iowan Old Style", Palatino, Georgia, serif;
        font-size: 74px;
        line-height: 1.14;
        letter-spacing: -0.015em;
        font-weight: 400;
        color: #f5f5f4;
      }

      /* The one word the product turns on, and the only colour in the type. */
      h1 em { font-style: italic; color: #f2b33d; }

      .meta {
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        padding-top: 26px;
        border-top: 1px solid #292524;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 19px;
        color: #78716c;
      }

      .dot { width: 3px; height: 3px; border-radius: 50%; background: #57534e; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glow"></div>

      <div class="top">
        <svg width="54" height="54" viewBox="0 0 24 24" fill="none">
          <path d="M9.75 14.25 18 6" stroke="#f2b33d" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M4.5 15.75 7.75 12.5" stroke="#f2b33d" stroke-width="2.25" stroke-linecap="round" opacity="0.5"/>
        </svg>
        <span class="name">Baton</span>
      </div>

      <h1>Your context, independent<br />of the AI you&rsquo;re <em>using</em>.</h1>

      <div class="meta">
        <span>Local-first</span><span class="dot"></span>
        <span>macOS + Windows</span><span class="dot"></span>
        <span>Free and open source</span>
      </div>
    </div>
  </body>
</html>
