<!--
  The app icon master. Every file in src-tauri/icons is generated from this:

      pnpm tauri icon assets/icon.png

  Drawn on the macOS icon grid: an 824px rounded square centred in a 1024px
  canvas, so it sits at the same optical size as every other app in the dock.
  The mark is the one in logo.svg, in brand amber on warm near-black, because a
  bright figure on a dark ground is what stays legible at 16px in a menu.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#302B27"/>
      <stop offset="1" stop-color="#181513"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ground)"/>

  <!-- logo.svg's 24-unit mark, scaled 29.5x and centred on its own bounding box. -->
  <g transform="translate(180.125 191.1875) scale(29.5)" stroke="#F2B33D" stroke-linecap="round">
    <path d="M9.75 14.25 18 6" stroke-width="3.5"/>
    <path d="M4.5 15.75 7.75 12.5" stroke-width="2.25" stroke-opacity="0.5"/>
  </g>
</svg>
