<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- The baton: a capsule caught mid-pass, angled along the direction of travel. -->
  <path d="M9.75 14.25 18 6" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Its trail: the same object one moment earlier. Encodes the handoff -
       one thing, moving between hands - rather than drawing two objects. -->
  <path d="M4.5 15.75 7.75 12.5" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" opacity="0.4"/>
</svg>
