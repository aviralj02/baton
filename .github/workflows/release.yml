# Builds the downloads. Triggered by pushing a tag: `git tag v0.1.0 && git push --tags`.
#
# The artefacts are UNSIGNED until the two secrets blocks below are filled in.
# An unsigned build is not merely "not notarised": macOS Gatekeeper refuses to
# open it at all, and SmartScreen warns on Windows. Say so in the release notes
# rather than marking it a prerelease: GitHub excludes prereleases from
# /releases/latest, which is where both the updater and the download page look.
name: Release

# Deliberately tag-only: no `workflow_dispatch`. Running this from the Actions
# tab on a branch would name the release after the branch and cut a release
# called "main". To rehearse it, push a throwaway tag and delete it after.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than two downloads: it is a 4.7MB app,
          # and asking a non-technical user which Mac they own is a step that
          # loses people.
          - os: macos-latest
            target: universal-apple-darwin
            args: "--target universal-apple-darwin"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater manifest. Not code signing: this is the key the
          # installed app checks before replacing itself, and without it the
          # build fails rather than shipping an unverifiable update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # TODO when the Apple Developer account exists: add these four repo
          # secrets and the build is notarised with no further changes here.
          # APPLE_CERTIFICATE: base64 of the exported Developer ID .p12
          # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID / APPLE_PASSWORD (app-specific) / APPLE_TEAM_ID
          #
          # TODO for Windows: WINDOWS_CERTIFICATE + WINDOWS_CERTIFICATE_PASSWORD.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Baton ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for what changed. These builds are not yet signed. On Windows, choose More info → Run anyway. On macOS, open the app once, then approve it in System Settings → Privacy & Security → Open Anyway (Control-click no longer works, and the button only appears for about an hour after the blocked launch)."
          includeUpdaterJson: true
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
